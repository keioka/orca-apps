version: '3'
services:
  web:
    build:
      context: .
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - .:/app
    ports:
      - 7777:5000
    environment:
      FLASK_DEBUG: 1
      ENV: ${ENV}
      DATABASE_URL: "postgresql://orca@host.docker.internal:5432/orca" # ${DATABASE_URL}